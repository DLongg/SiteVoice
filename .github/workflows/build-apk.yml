name: Build & Release Debug APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Bản cập nhật mới nhất (Latest Build)' }}
          body: |
            Bản cập nhật tự động SiteVoice APK cho thiết bị Android.
            
            ### Cách cài đặt:
            1. Tải file **app-debug.apk** ở phần Assets bên dưới về điện thoại.
            2. Mở file APK vừa tải và chọn **Cập nhật** (hoặc **Cài đặt**).
            3. Dữ liệu ghi âm, database và cấu hình API Key trên máy của bạn sẽ được giữ nguyên hoàn toàn.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
